name: Mobile release packages (iOS IPA · Android · Web)

# iOS: unsigned device IPA (iphoneos / arm64) for Sideloadly re-sign on your phone.
# Android: signed release when keystore secrets exist.
# Web: installable zip.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  APP_NAME: sunshine-city-harare-hustle
  BUNDLE_ID: zw.sunshinecity.hararehustle

jobs:
  web-build:
    name: Web install package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Stage installable web package (with icons)
        run: |
          mkdir -p packages/web
          cp dist/index.html packages/web/
          cp dist/manifest.webmanifest packages/web/
          cp dist/icon-192.png dist/icon-512.png dist/icon-1024.png dist/apple-touch-icon.png packages/web/
          cd packages/web && zip -r ../../${{ env.APP_NAME }}-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-install-zip
          path: ${{ env.APP_NAME }}-web.zip

  android-release:
    name: Android packages
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - name: Capacitor Android + app icon
        run: |
          npx cap add android
          npx cap sync android
          node tools/ci/apply-native-icons.mjs
      - name: Build debug APK (always installable for testing)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Signed release (if keystore secrets present)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SUNSHINE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SUNSHINE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SUNSHINE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/sunshine-upload.jks
          cd ..
          node tools/ci/patch-android-signing.mjs
          cd android
          export SUNSHINE_KEYSTORE_PATH=sunshine-upload.jks
          ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Collect packages
        run: |
          mkdir -p packages/android
          find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp -v {} packages/android/ \;
          ls -lah packages/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: packages/android/
          if-no-files-found: error

  ios-sideload:
    name: iOS unsigned IPA (Sideloadly / real iPhone)
    runs-on: macos-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Capacitor iOS + app icon
        run: |
          npx cap add ios
          npx cap sync ios
          node tools/ci/apply-native-icons.mjs
      - name: CocoaPods
        working-directory: ios/App
        run: pod install
      - name: Build Release for real devices (iphoneos, unsigned)
        working-directory: ios/App
        run: |
          # Device slice (arm64) — NOT simulator. Sideloadly re-signs on install.
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ env.BUNDLE_ID }}" \
            build
      - name: Package Sideloadly IPA
        run: |
          chmod +x tools/ci/package-unsigned-ipa.sh
          APP_PATH=$(find ios/App/build/Build/Products -type d -name '*.app' | head -1)
          echo "Found app: $APP_PATH"
          # Confirm it's a device binary, not simulator
          lipo -info "$APP_PATH/App" 2>/dev/null || lipo -info "$APP_PATH"/* 2>/dev/null || true
          file "$APP_PATH"/* 2>/dev/null | head -20 || true
          mkdir -p packages/ios
          tools/ci/package-unsigned-ipa.sh "$APP_PATH" "$PWD/packages/ios/${{ env.APP_NAME }}-unsigned-sideloadly.ipa"
          ls -lah packages/ios
      - uses: actions/upload-artifact@v4
        with:
          name: ios-sideloadly-ipa
          path: packages/ios/*.ipa
          if-no-files-found: error
